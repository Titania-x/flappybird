<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>Dino Mochi</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
overflow:hidden;
background:#000;
touch-action:none;
font-family:Arial,sans-serif;
}

canvas{
display:block;
width:100vw;
height:100vh;
}

</style>
</head>

<body>

<canvas id="game"></canvas>

<script>

/* ======================================================
   STORAGE
====================================================== */

function saveData(key,value){

try{
localStorage.setItem(key,JSON.stringify(value));
}catch(e){}

}

function loadData(key,def){

try{

const v = localStorage.getItem(key);
return v ? JSON.parse(v) : def;

}catch(e){

return def;

}

}

/* ======================================================
   CANVAS
====================================================== */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize(){

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

}

resize();

window.addEventListener("resize",resize);

/* ======================================================
   AUDIO
====================================================== */

const AudioContextClass =
window.AudioContext || window.webkitAudioContext;

const audioCtx = new AudioContextClass();

function sound(type){

const osc = audioCtx.createOscillator();
const gain = audioCtx.createGain();

osc.connect(gain);
gain.connect(audioCtx.destination);

osc.type = "sawtooth";

if(type==="jump"){

osc.frequency.setValueAtTime(
220,
audioCtx.currentTime
);

}

if(type==="coin"){

osc.frequency.setValueAtTime(
880,
audioCtx.currentTime
);

}

if(type==="dead"){

osc.frequency.setValueAtTime(
90,
audioCtx.currentTime
);

}

if(type==="roar"){

osc.frequency.setValueAtTime(
180,
audioCtx.currentTime
);

osc.frequency.exponentialRampToValueAtTime(
70,
audioCtx.currentTime + 0.35
);

}

gain.gain.setValueAtTime(
0.2,
audioCtx.currentTime
);

gain.gain.exponentialRampToValueAtTime(
0.0001,
audioCtx.currentTime + 0.4
);

osc.start();
osc.stop(audioCtx.currentTime + 0.4);

}

/* ======================================================
   SAVE
====================================================== */

let highScore = loadData("dino_high",0);
let coins = loadData("dino_coins",0);
let ownedSkins = loadData("dino_skins",[0]);
let currentSkin = loadData("dino_skin",0);

/* ======================================================
   STATES
====================================================== */

const STATE = {

MENU:0,
SHOP:1,
PLAY:2,
OVER:3

};

let state = STATE.MENU;

/* ======================================================
   GAME
====================================================== */

let frame = 0;
let score = 0;

let speed = 3;
let gap = 250;
let spawnRate = 110;

/* ======================================================
   PLAYER
====================================================== */

const dino = {

x:120,
y:300,
r:24,

vel:0,

gravity:0.42,
lift:-8.8

};

/* ======================================================
   DINO SKINS
====================================================== */

const skins = [

{
name:"Rex",
body:"#6BCB77",
belly:"#C7F9CC",
spike:"#2D6A4F",
price:0,
wings:false
},

{
name:"Raptor",
body:"#4D96FF",
belly:"#D7E3FC",
spike:"#1E3A8A",
price:50,
wings:false
},

{
name:"Spino",
body:"#FF6B6B",
belly:"#FFD6A5",
spike:"#C1121F",
price:100,
wings:false
},

{
name:"Dragon",
body:"#9D4EDD",
belly:"#E0AAFF",
spike:"#5A189A",
price:300,
wings:false
},

{
name:"Winged King",
body:"#FFD60A",
belly:"#FFF3BF",
spike:"#FF5400",
price:500,
wings:true
}

];

/* ======================================================
   OBJECTS
====================================================== */

let pipes = [];
let coinsArr = [];

/* ======================================================
   BACKGROUND
====================================================== */

function drawBackground(){

let g = ctx.createLinearGradient(
0,0,0,canvas.height
);

g.addColorStop(0,"#87CEEB");
g.addColorStop(1,"#3A7D44");

ctx.fillStyle = g;
ctx.fillRect(0,0,canvas.width,canvas.height);

/* mountains */

ctx.fillStyle="#5B8C5A";

for(let i=0;i<canvas.width;i+=220){

ctx.beginPath();

ctx.moveTo(i,canvas.height);

ctx.lineTo(i+110,canvas.height-180);

ctx.lineTo(i+220,canvas.height);

ctx.fill();

}

/* ground */

ctx.fillStyle="#4E944F";

ctx.fillRect(
0,
canvas.height-70,
canvas.width,
70
);

}

/* ======================================================
   DINO
====================================================== */

function drawDino(){

let s = skins[currentSkin];

ctx.save();

ctx.translate(dino.x,dino.y);

ctx.rotate(dino.vel * 0.03);

/* animated wings */

if(s.wings){

let flap =
Math.sin(frame * 0.3) * 12;

ctx.fillStyle="rgba(255,255,255,0.85)";

/* left wing */

ctx.beginPath();

ctx.moveTo(-10,-5);
ctx.lineTo(-42,-22-flap);
ctx.lineTo(-30,10);

ctx.fill();

/* right wing */

ctx.beginPath();

ctx.moveTo(10,-5);
ctx.lineTo(42,-22+flap);
ctx.lineTo(30,10);

ctx.fill();

}

/* body */

ctx.fillStyle=s.body;

ctx.beginPath();
ctx.arc(0,0,dino.r,0,Math.PI*2);
ctx.fill();

/* belly */

ctx.fillStyle=s.belly;

ctx.beginPath();
ctx.arc(3,6,12,0,Math.PI*2);
ctx.fill();

/* tail */

ctx.fillStyle=s.body;

ctx.beginPath();

ctx.moveTo(-20,5);
ctx.lineTo(-40,0);
ctx.lineTo(-20,-8);

ctx.fill();

/* spikes */

ctx.fillStyle=s.spike;

for(let i=-10;i<15;i+=10){

ctx.beginPath();

ctx.moveTo(i,-18);
ctx.lineTo(i+5,-32);
ctx.lineTo(i+10,-18);

ctx.fill();

}

/* eye */

ctx.fillStyle="#000";

ctx.beginPath();
ctx.arc(8,-6,3,0,Math.PI*2);
ctx.fill();

ctx.restore();

}

/* ======================================================
   COINS
====================================================== */

function spawnCoin(pipe){

let safeY =
pipe.top + (gap/2);

coinsArr.push({

x:pipe.x + 42,
y:safeY,
r:11

});

}

function updateCoins(){

coinsArr.forEach(c=>{

c.x -= speed;

let dx = dino.x - c.x;
let dy = dino.y - c.y;

let dist = Math.sqrt(dx*dx+dy*dy);

if(dist < dino.r + c.r){

coins++;

saveData("dino_coins",coins);

sound("coin");

c.hit = true;

}

});

coinsArr = coinsArr.filter(
c => !c.hit && c.x > -50
);

}

function drawCoins(){

coinsArr.forEach(c=>{

ctx.fillStyle="#FFD700";

ctx.beginPath();
ctx.arc(c.x,c.y,c.r,0,Math.PI*2);
ctx.fill();

ctx.strokeStyle="#FFF";
ctx.lineWidth=3;
ctx.stroke();

});

}

/* ======================================================
   PIPES
====================================================== */

function createPipe(){

let top =
Math.random() *
(canvas.height - 500) + 120;

let pipe = {

x:canvas.width,
top:top,
passed:false

};

pipes.push(pipe);

spawnCoin(pipe);

}

function updatePipes(){

pipes.forEach(p=>{

p.x -= speed;

if(!p.passed && p.x+90 < dino.x){

p.passed = true;
score++;

}

/* collision */

let collideX =

dino.x + dino.r > p.x &&
dino.x - dino.r < p.x + 90;

let collideY =

dino.y - dino.r < p.top ||
dino.y + dino.r > p.top + gap;

if(collideX && collideY){

sound("dead");

state = STATE.OVER;

}

});

pipes = pipes.filter(
p => p.x > -120
);

}

function drawPipes(){

pipes.forEach(p=>{

ctx.fillStyle="#2D6A4F";

ctx.fillRect(
p.x,
0,
90,
p.top
);

ctx.fillRect(
p.x,
p.top+gap,
90,
canvas.height
);

ctx.strokeStyle="#95D5B2";
ctx.lineWidth=4;

for(let y=0;y<p.top;y+=40){

ctx.beginPath();

ctx.moveTo(p.x+25,y);
ctx.lineTo(p.x+25,y+20);

ctx.stroke();

}

});

}

/* ======================================================
   PLAYER PHYSICS
====================================================== */

function updateDino(){

dino.vel += dino.gravity;

dino.y += dino.vel;

if(dino.y + dino.r > canvas.height-70){

sound("dead");

state = STATE.OVER;

}

if(dino.y - dino.r < 0){

dino.y = dino.r;
dino.vel = 0;

}

}

/* ======================================================
   UI
====================================================== */

function drawUI(){

ctx.fillStyle="#FFF";

ctx.font="22px Arial";

ctx.fillText(
"Score: "+score,
20,
40
);

ctx.fillText(
"Coins: "+coins,
20,
75
);

ctx.fillText(
"High: "+highScore,
20,
110
);

}

/* ======================================================
   MENU
====================================================== */

function drawMenu(){

drawBackground();

ctx.textAlign="center";

ctx.fillStyle="#FFF";

ctx.font="clamp(42px,8vw,60px) Arial";

ctx.fillText(
"DINO MOCHI",
canvas.width/2,
180
);

ctx.font="24px Arial";

ctx.fillText(
"Roar and Fly!",
canvas.width/2,
230
);

/* play */

ctx.fillStyle="#38B000";

ctx.fillRect(
canvas.width/2-130,
320,
260,
70
);

ctx.fillStyle="#FFF";

ctx.font="35px Arial";

ctx.fillText(
"PLAY",
canvas.width/2,
365
);

/* shop */

ctx.fillStyle="#FFB703";

ctx.fillRect(
canvas.width/2-130,
430,
260,
70
);

ctx.fillStyle="#FFF";

ctx.fillText(
"SHOP",
canvas.width/2,
475
);

ctx.textAlign="left";

}

/* ======================================================
   SHOP
====================================================== */

function drawShop(){

drawBackground();

ctx.fillStyle="#FFF";

ctx.textAlign="center";

ctx.font="42px Arial";

ctx.fillText(
"DINO SHOP",
canvas.width/2,
80
);

ctx.font="24px Arial";

ctx.fillText(
"Coins: "+coins,
canvas.width/2,
120
);

skins.forEach((s,i)=>{

let spacing = canvas.width / skins.length;
let x = spacing * i + spacing/2;
let y = canvas.height/2;

ctx.fillStyle="rgba(255,255,255,0.15)";

ctx.fillRect(
x-55,
y-70,
110,
170
);

/* dino icon */

ctx.fillStyle=s.body;

ctx.beginPath();
ctx.arc(x,y,26,0,Math.PI*2);
ctx.fill();

/* wings preview */

if(s.wings){

let flap =
Math.sin(frame * 0.3) * 8;

ctx.fillStyle="#FFF";

ctx.beginPath();

ctx.moveTo(x-5,y);
ctx.lineTo(x-28,y-18-flap);
ctx.lineTo(x-20,y+8);

ctx.fill();

ctx.beginPath();

ctx.moveTo(x+5,y);
ctx.lineTo(x+28,y-18+flap);
ctx.lineTo(x+20,y+8);

ctx.fill();

}

ctx.fillStyle=s.spike;

ctx.fillRect(x-12,y-38,24,10);

ctx.fillStyle="#FFF";

ctx.font="15px Arial";

ctx.fillText(
s.name,
x,
y+55
);

if(ownedSkins.includes(i)){

if(currentSkin===i){

ctx.fillStyle="#38B000";
ctx.fillText("USING",x,y+82);

}else{

ctx.fillStyle="#FFD60A";
ctx.fillText("USE",x,y+82);

}

}else{

ctx.fillStyle="#FF595E";

ctx.fillText(
s.price+" COINS",
x,
y+82
);

}

});

/* back */

ctx.fillStyle="#222";

ctx.fillRect(20,20,120,50);

ctx.fillStyle="#FFF";

ctx.font="24px Arial";

ctx.fillText("BACK",80,53);

ctx.textAlign="left";

}

/* ======================================================
   RESET
====================================================== */

function reset(){

pipes = [];
coinsArr = [];

score = 0;
frame = 0;

dino.y = canvas.height/2;
dino.vel = 0;

state = STATE.PLAY;

sound("roar");

setTimeout(()=>{
sound("roar");
},220);

}

/* ======================================================
   LOOP
====================================================== */

function loop(){

drawBackground();

if(state===STATE.MENU){

drawMenu();

}

else if(state===STATE.SHOP){

drawShop();

}

else if(state===STATE.PLAY){

speed = 3 + score * 0.08;

updateDino();
updatePipes();
updateCoins();

if(frame % spawnRate===0){

createPipe();

}

drawPipes();
drawCoins();
drawDino();
drawUI();

frame++;

}

else if(state===STATE.OVER){

if(score > highScore){

highScore = score;

saveData(
"dino_high",
highScore
);

}

drawPipes();
drawCoins();
drawDino();

ctx.fillStyle="rgba(0,0,0,0.6)";

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);

ctx.fillStyle="#FFF";

ctx.textAlign="center";

ctx.font="48px Arial";

ctx.fillText(
"GAME OVER",
canvas.width/2,
canvas.height/2-90
);

ctx.font="30px Arial";

ctx.fillText(
"Score: "+score,
canvas.width/2,
canvas.height/2-35
);

/* restart */

ctx.fillStyle="#38B000";

ctx.fillRect(
canvas.width/2-130,
canvas.height/2+20,
260,
65
);

ctx.fillStyle="#FFF";

ctx.fillText(
"RESTART",
canvas.width/2,
canvas.height/2+62
);

/* shop button */

ctx.fillStyle="#FFB703";

ctx.fillRect(
canvas.width/2-130,
canvas.height/2+105,
260,
65
);

ctx.fillStyle="#FFF";

ctx.fillText(
"SHOP",
canvas.width/2,
canvas.height/2+147
);

ctx.textAlign="left";

}

requestAnimationFrame(loop);

}

loop();

/* ======================================================
   INPUT
====================================================== */

function tap(e){

e.preventDefault();

if(audioCtx.state==="suspended"){

audioCtx.resume();

}

const rect =
canvas.getBoundingClientRect();

const x =
(e.touches ?
e.touches[0].clientX :
e.clientX) - rect.left;

const y =
(e.touches ?
e.touches[0].clientY :
e.clientY) - rect.top;

/* MENU */

if(state===STATE.MENU){

if(

x > canvas.width/2-130 &&
x < canvas.width/2+130 &&
y > 320 &&
y < 390

){

reset();
return;

}

if(

x > canvas.width/2-130 &&
x < canvas.width/2+130 &&
y > 430 &&
y < 500

){

state = STATE.SHOP;
return;

}

}

/* SHOP */

if(state===STATE.SHOP){

if(

x > 20 &&
x < 140 &&
y > 20 &&
y < 70

){

state = STATE.MENU;
return;

}

skins.forEach((s,i)=>{

let spacing = canvas.width / skins.length;
let sx = spacing * i + spacing/2;
let sy = canvas.height/2;

if(

x > sx-55 &&
x < sx+55 &&
y > sy-70 &&
y < sy+100

){

if(ownedSkins.includes(i)){

currentSkin = i;

saveData(
"dino_skin",
currentSkin
);

sound("roar");

}else if(coins >= s.price){

coins -= s.price;

ownedSkins.push(i);

currentSkin = i;

saveData(
"dino_coins",
coins
);

saveData(
"dino_skins",
ownedSkins
);

saveData(
"dino_skin",
currentSkin
);

sound("roar");

}

}

});

return;

}

/* OVER */

if(state===STATE.OVER){

if(

x > canvas.width/2-130 &&
x < canvas.width/2+130 &&
y > canvas.height/2+20 &&
y < canvas.height/2+85

){

reset();
return;

}

if(

x > canvas.width/2-130 &&
x < canvas.width/2+130 &&
y > canvas.height/2+105 &&
y < canvas.height/2+170

){

state = STATE.SHOP;
return;

}

}

/* PLAY */

if(state===STATE.PLAY){

dino.vel = dino.lift;

sound("jump");

}

}

canvas.addEventListener(
"touchstart",
tap,
{passive:false}
);

canvas.addEventListener(
"mousedown",
tap
);

</script>

</body>
</html>
