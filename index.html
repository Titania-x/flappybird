<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sky Mochi</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{overflow:hidden;background:#AEE2FF;font-family:Arial;}
canvas{display:block;}
</style>
</head>

<body>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

window.addEventListener("resize", () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});

const STATE = { START:0, PLAY:1, OVER:2 };
let gameState = STATE.START;

let frame = 0;
let score = 0;

let speed = 4;
let spawnRate = 90;

let shake = 0;

const bird = {
  x:120,
  y:250,
  r:22,
  vel:0,
  gravity:0.6,
  lift:-10
};

let pipes = [];
let particles = [];

function drawBackground(){

  let g = ctx.createLinearGradient(0,0,0,canvas.height);
  g.addColorStop(0,"#89f7fe");
  g.addColorStop(1,"#66a6ff");

  ctx.fillStyle = g;
  ctx.fillRect(0,0,canvas.width,canvas.height);

}

function drawBird(){

  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(bird.vel * 0.05);

  // body
  ctx.fillStyle = "#FFD166";
  ctx.beginPath();
  ctx.arc(0,0,bird.r,0,Math.PI*2);
  ctx.fill();

  // wing
  ctx.fillStyle = "#FFC300";
  ctx.beginPath();
  ctx.arc(-6,5,10,0,Math.PI*2);
  ctx.fill();

  // eye
  ctx.fillStyle = "#000";
  ctx.beginPath();
  ctx.arc(8,-5,3,0,Math.PI*2);
  ctx.fill();

  // blush
  ctx.fillStyle = "#FF8FAB";
  ctx.beginPath();
  ctx.arc(-8,5,4,0,Math.PI*2);
  ctx.fill();

  ctx.restore();
}

function flapParticles(){
  for(let i=0;i<5;i++){
    particles.push({
      x: bird.x,
      y: bird.y,
      vx: (Math.random()-0.5)*3,
      vy: Math.random()*-2,
      life: 30
    });
  }
}

function updateParticles(){

  particles.forEach(p=>{
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
  });

  particles = particles.filter(p=>p.life>0);

}

function drawParticles(){

  ctx.fillStyle = "#fff";
  particles.forEach(p=>{
    ctx.globalAlpha = p.life/30;
    ctx.beginPath();
    ctx.arc(p.x,p.y,3,0,Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

}

function updateBird(){

  bird.vel += bird.gravity;
  bird.y += bird.vel;

  if(bird.y + bird.r > canvas.height){
    gameState = STATE.OVER;
  }

  if(bird.y - bird.r < 0){
    bird.y = bird.r;
    bird.vel = 0;
  }
}

function createPipe(){

  let gap = 180;

  let top = Math.random() * (canvas.height - 300) + 50;

  pipes.push({
    x: canvas.width,
    top: top,
    bottom: top + gap,
    w: 80,
    passed:false
  });
}

function drawPipes(){

  pipes.forEach(p=>{

    let grad = ctx.createLinearGradient(p.x,0,p.x+p.w,0);
    grad.addColorStop(0,"#ff9ecb");
    grad.addColorStop(1,"#ffd6ec");

    ctx.fillStyle = grad;

    ctx.beginPath();
    ctx.roundRect(p.x,0,p.w,p.top,20);
    ctx.fill();

    ctx.beginPath();
    ctx.roundRect(p.x,p.bottom,p.w,canvas.height,20);
    ctx.fill();

  });

}

function updatePipes(){

  pipes.forEach(p=>{

    p.x -= speed;

    if(!p.passed && p.x + p.w < bird.x){
      p.passed = true;
      score++;
    }

    // collision
    if(
      bird.x + bird.r > p.x &&
      bird.x - bird.r < p.x + p.w &&
      (
        bird.y - bird.r < p.top ||
        bird.y + bird.r > p.bottom
      )
    ){
      shake = 12;
      gameState = STATE.OVER;
    }

  });

  pipes = pipes.filter(p=>p.x + p.w > 0);
}

function drawScore(){

  ctx.fillStyle = "#fff";
  ctx.font = "bold 40px Arial";
  ctx.fillText(score, 30, 60);

}

function drawStart(){

  ctx.fillStyle = "rgba(255,255,255,0.9)";
  ctx.fillRect(40,120,canvas.width-80,300);

  ctx.fillStyle = "#ff69b4";
  ctx.font = "bold 60px Arial";
  ctx.textAlign = "center";
  ctx.fillText("Sky Mochi", canvas.width/2, 220);

  ctx.fillStyle = "#444";
  ctx.font = "28px Arial";
  ctx.fillText("Tap to Flap", canvas.width/2, 290);
  ctx.fillText("Avoid the sweet pipes!", canvas.width/2, 340);

  ctx.textAlign = "left";
}

function drawGameOver(){

  ctx.fillStyle = "rgba(0,0,0,0.5)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle = "#fff";
  ctx.textAlign = "center";

  ctx.font = "60px Arial";
  ctx.fillText("Game Over", canvas.width/2, canvas.height/2 - 60);

  ctx.font = "40px Arial";
  ctx.fillText("Score: " + score, canvas.width/2, canvas.height/2);

  ctx.font = "28px Arial";
  ctx.fillText("Tap to Restart", canvas.width/2, canvas.height/2 + 60);

  ctx.textAlign = "left";
}

function reset(){
  pipes = [];
  particles = [];
  score = 0;
  frame = 0;
  speed = 4;
  spawnRate = 90;
  bird.y = 250;
  bird.vel = 0;
  gameState = STATE.PLAY;
}

function loop(){

  // screen shake
  ctx.save();
  if(shake > 0){
    ctx.translate(
      (Math.random()-0.5)*shake,
      (Math.random()-0.5)*shake
    );
    shake *= 0.85;
  }

  drawBackground();

  if(gameState === STATE.START){
    drawStart();
  }

  if(gameState === STATE.PLAY){

    updateBird();
    updateParticles();

    if(frame % spawnRate === 0){
      createPipe();
    }

    // difficulty scaling
    if(frame % 300 === 0){
      speed += 0.2;
      spawnRate = Math.max(55, spawnRate - 2);
    }

    updatePipes();

    drawPipes();
    drawBird();
    drawParticles();
    drawScore();

    frame++;
  }

  if(gameState === STATE.OVER){
    drawPipes();
    drawBird();
    drawParticles();
    drawGameOver();
  }

  ctx.restore();
  requestAnimationFrame(loop);
}

function flap(){

  if(gameState === STATE.START){
    gameState = STATE.PLAY;
  }

  if(gameState === STATE.OVER){
    reset();
    return;
  }

  bird.vel = bird.lift;
  flapParticles();
}

document.addEventListener("touchstart", flap);
document.addEventListener("mousedown", flap);

loop();
</script>

</body>
</html>
