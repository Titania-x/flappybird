<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sky Mochi</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{overflow:hidden;background:#AEE2FF;font-family:Arial;}
canvas{display:block;}
</style>
</head>

<body>
<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

window.addEventListener("resize", () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});

const STATE = { START:0, PLAY:1, OVER:2, SHOP:3 };
let gameState = STATE.START;

/* ---------------- LEVEL MODES ---------------- */
const MODES = {
  EASY:   { speed:3, spawn:110, gap:200 },
  NORMAL: { speed:4, spawn:90,  gap:180 },
  HARD:   { speed:5.5, spawn:70, gap:150 }
};

let mode = MODES.NORMAL;

/* ---------------- SAVE DATA ---------------- */
let highScore = localStorage.getItem("skyMochiHigh") || 0;

/* ---------------- GAME VALUES ---------------- */
let frame = 0;
let score = 0;
let shake = 0;

let speed = mode.speed;
let spawnRate = mode.spawn;
let gapSize = mode.gap;

/* ---------------- SKINS ---------------- */
const skins = [
  { body:"#FFD166", wing:"#FFC300", blush:"#FF8FAB" }, // default
  { body:"#FF9AA2", wing:"#FFB7B2", blush:"#FF6F91" }, // strawberry
  { body:"#B5EAD7", wing:"#C7F9CC", blush:"#9BF6FF" }, // mint
  { body:"#CDB4DB", wing:"#FFC8DD", blush:"#FFAFCC" }  // grape
];

let skinIndex = 0;

/* ---------------- BIRD ---------------- */
const bird = {
  x:120,
  y:250,
  r:22,
  vel:0,
  gravity:0.55,
  lift:-9.5
};

/* ---------------- OBJECTS ---------------- */
let pipes = [];
let particles = [];

/* ---------------- DRAW BACKGROUND ---------------- */
function bg(){
  let g = ctx.createLinearGradient(0,0,0,canvas.height);
  g.addColorStop(0,"#89f7fe");
  g.addColorStop(1,"#66a6ff");
  ctx.fillStyle = g;
  ctx.fillRect(0,0,canvas.width,canvas.height);
}

/* ---------------- BIRD ---------------- */
function drawBird(){

  let s = skins[skinIndex];

  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(bird.vel * 0.04);

  ctx.fillStyle = s.body;
  ctx.beginPath();
  ctx.arc(0,0,bird.r,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle = s.wing;
  ctx.beginPath();
  ctx.arc(-6,5,10,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle = "#000";
  ctx.beginPath();
  ctx.arc(8,-5,3,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle = s.blush;
  ctx.beginPath();
  ctx.arc(-8,5,4,0,Math.PI*2);
  ctx.fill();

  ctx.restore();
}

/* ---------------- PARTICLES ---------------- */
function puff(){
  for(let i=0;i<4;i++){
    particles.push({
      x:bird.x,
      y:bird.y,
      vx:(Math.random()-0.5)*2.5,
      vy:Math.random()*-2,
      life:25
    });
  }
}

function updateParticles(){
  particles.forEach(p=>{
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
  });
  particles = particles.filter(p=>p.life>0);
}

function drawParticles(){
  ctx.fillStyle="#fff";
  particles.forEach(p=>{
    ctx.globalAlpha = p.life/25;
    ctx.beginPath();
    ctx.arc(p.x,p.y,3,0,Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha=1;
}

/* ---------------- BIRD PHYSICS (FIXED FEELING) ---------------- */
function updateBird(){

  bird.vel += bird.gravity;
  bird.vel *= 0.98; // smoother control (IMPORTANT FIX)
  bird.y += bird.vel;

  // no sticky pipe feeling anymore
  // cleaner boundaries
  if(bird.y + bird.r > canvas.height){
    gameState = STATE.OVER;
    shake = 10;
  }

  if(bird.y - bird.r < 0){
    bird.y = bird.r;
    bird.vel = 0;
  }
}

/* ---------------- PIPES ---------------- */
function createPipe(){
  pipes.push({
    x:canvas.width,
    top:Math.random()*(canvas.height-300)+50,
    passed:false
  });
}

function drawPipes(){

  pipes.forEach(p=>{

    ctx.fillStyle="#7ED957";

    ctx.fillRect(p.x,0,80,p.top);
    ctx.fillRect(p.x,p.top+gapSize,80,canvas.height);

  });
}

function updatePipes(){

  pipes.forEach(p=>{

    p.x -= speed;

    if(!p.passed && p.x + 80 < bird.x){
      p.passed = true;
      score++;
    }

    // better hitbox (less unfair deaths)
    if(
      bird.x + bird.r > p.x &&
      bird.x - bird.r < p.x + 80 &&
      (
        bird.y - bird.r < p.top ||
        bird.y + bird.r > p.top + gapSize
      )
    ){
      gameState = STATE.OVER;
      shake = 12;
    }

  });

  pipes = pipes.filter(p=>p.x > -100);
}

/* ---------------- UI ---------------- */
function drawScore(){
  ctx.fillStyle="#fff";
  ctx.font="40px Arial";
  ctx.fillText(score,30,60);

  ctx.font="20px Arial";
  ctx.fillText("Best: "+highScore,30,90);
}

/* ---------------- START SCREEN ---------------- */
function start(){
  ctx.fillStyle="rgba(255,255,255,0.9)";
  ctx.fillRect(40,120,canvas.width-80,300);

  ctx.fillStyle="#ff69b4";
  ctx.font="60px Arial";
  ctx.textAlign="center";
  ctx.fillText("Sky Mochi",canvas.width/2,220);

  ctx.fillStyle="#444";
  ctx.font="25px Arial";
  ctx.fillText("Tap to Start",canvas.width/2,300);
  ctx.fillText("Choose Mode: Easy / Normal / Hard",canvas.width/2,340);

  ctx.textAlign="left";
}

/* ---------------- GAME OVER ---------------- */
function over(){

  if(score > highScore){
    highScore = score;
    localStorage.setItem("skyMochiHigh", highScore);
  }

  ctx.fillStyle="rgba(0,0,0,0.5)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle="#fff";
  ctx.textAlign="center";

  ctx.font="60px Arial";
  ctx.fillText("Game Over",canvas.width/2,canvas.height/2-60);

  ctx.font="40px Arial";
  ctx.fillText("Score: "+score,canvas.width/2,canvas.height/2);

  ctx.font="25px Arial";
  ctx.fillText("Tap to Restart",canvas.width/2,canvas.height/2+50);

  ctx.fillText("Tap 2x for Shop",canvas.width/2,canvas.height/2+90);

  ctx.textAlign="left";
}

/* ---------------- SHOP ---------------- */
function shop(){

  ctx.fillStyle="rgba(255,255,255,0.95)";
  ctx.fillRect(40,100,canvas.width-80,400);

  ctx.fillStyle="#ff69b4";
  ctx.font="40px Arial";
  ctx.textAlign="center";
  ctx.fillText("SKINS SHOP",canvas.width/2,170);

  skins.forEach((s,i)=>{

    ctx.fillStyle=s.body;
    ctx.beginPath();
    ctx.arc(120+i*120,280,25,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#333";
    ctx.font="18px Arial";
    ctx.fillText("Tap "+(i+1),100+i*120,330);
  });

  ctx.textAlign="left";
}

/* ---------------- RESET ---------------- */
function reset(){
  pipes=[];
  particles=[];
  score=0;
  frame=0;

  speed = mode.speed;
  spawnRate = mode.spawn;
  gapSize = mode.gap;

  bird.y=250;
  bird.vel=0;

  gameState=STATE.PLAY;
}

/* ---------------- LOOP ---------------- */
function loop(){

  ctx.save();

  if(shake>0){
    ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
    shake*=0.85;
  }

  bg();

  if(gameState===STATE.START){
    start();
  }

  if(gameState===STATE.PLAY){

    updateBird();
    updateParticles();

    if(frame%spawnRate===0) createPipe();

    // smooth difficulty scaling
    if(frame%400===0){
      speed += 0.15;
      spawnRate = Math.max(50, spawnRate-2);
    }

    updatePipes();

    drawPipes();
    drawBird();
    drawParticles();
    drawScore();

    frame++;
  }

  if(gameState===STATE.OVER){
    drawPipes();
    drawBird();
    drawParticles();
    over();
  }

  if(gameState===STATE.SHOP){
    shop();
  }

  ctx.restore();
  requestAnimationFrame(loop);
}

/* ---------------- INPUT ---------------- */
function tap(){

  if(gameState===STATE.START){
    gameState=STATE.PLAY;
  }
  else if(gameState===STATE.OVER){
    reset();
  }
  else if(gameState===STATE.SHOP){
    gameState=STATE.START;
  }
  else{
    bird.vel = bird.lift;
    puff();
  }
}

/* skin selection */
document.addEventListener("keydown",(e)=>{
  if(gameState===STATE.START){
    if(e.key==="1") mode=MODES.EASY;
    if(e.key==="2") mode=MODES.NORMAL;
    if(e.key==="3") mode=MODES.HARD;
  }
});

document.addEventListener("touchstart",tap);
document.addEventListener("mousedown",tap);

loop();

</script>

</body>
</html>
