<!DOCTYPE html>
<html>
<head>
<title>Flappy Bird</title>

<style>

body{
  margin:0;
  overflow:hidden;
  background:#70c5ce;
}

canvas{
  display:block;
}

</style>

</head>
<body>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let bird = {
  x:50,
  y:150,
  width:30,
  height:30,
  gravity:0.6,
  lift:-10,
  velocity:0
};

let pipes = [];
let frame = 0;

function drawBird(){
  ctx.fillStyle = "yellow";
  ctx.fillRect(
    bird.x,
    bird.y,
    bird.width,
    bird.height
  );
}

function updateBird(){
  bird.velocity += bird.gravity;
  bird.y += bird.velocity;
}

function createPipe(){

  let top = Math.random() * 300;

  pipes.push({
    x:canvas.width,
    top:top,
    bottom:top + 150,
    width:60
  });

}

function drawPipes(){

  ctx.fillStyle = "green";

  pipes.forEach(pipe => {

    ctx.fillRect(
      pipe.x,
      0,
      pipe.width,
      pipe.top
    );

    ctx.fillRect(
      pipe.x,
      pipe.bottom,
      pipe.width,
      canvas.height
    );

  });

}

function updatePipes(){

  pipes.forEach(pipe => {
    pipe.x -= 3;
  });

}

function gameLoop(){

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  drawBird();
  updateBird();

  if(frame % 90 === 0){
    createPipe();
  }

  drawPipes();
  updatePipes();

  frame++;

  requestAnimationFrame(gameLoop);

}

document.addEventListener(
  "touchstart",
  () => {
    bird.velocity = bird.lift;
  }
);

gameLoop();

</script>

</body>
</html>
