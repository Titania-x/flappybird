<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sky Mochi</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{overflow:hidden;font-family:Arial;}
canvas{display:block;}
</style>
</head>

<body>
<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

/* ---------------- SAVE DATA ---------------- */
let highScore = Number(localStorage.getItem("sky_high")) || 0;
let coins = Number(localStorage.getItem("sky_coins")) || 0;
let ownedSkins = JSON.parse(localStorage.getItem("sky_skins")) || [0];
let currentSkin = Number(localStorage.getItem("sky_currentSkin")) || 0;

/* ---------------- GAME STATE ---------------- */
const STATE = { START:0, PLAY:1, OVER:2, SHOP:3 };
let state = STATE.START;

/* ---------------- GAME VALUES ---------------- */
let frame = 0;
let score = 0;

let speed = 3;
let spawnRate = 90;
let gap = 180;

/* ---------------- BIRD ---------------- */
const bird = {
  x:120,
  y:250,
  r:22,
  vel:0,
  gravity:0.55,
  lift:-9
};

/* ---------------- SKINS (DINOSAURS 🦖) ---------------- */
const skins = [
  {name:"Rex", body:"#FFD166", wing:"#FFC300", blush:"#FF8FAB"},
  {name:"Tricera", body:"#7BD389", wing:"#A0E7E5", blush:"#FFB7B2"},
  {name:"Raptor", body:"#CDB4DB", wing:"#FFC8DD", blush:"#FFAFCC"},
  {name:"Spino", body:"#90CAF9", wing:"#64B5F6", blush:"#F48FB1"}
];

/* ---------------- OBJECTS ---------------- */
let pipes = [];
let coinsArr = [];

/* ---------------- BACKGROUND ---------------- */
function drawBackground(){

  if(score <= 50){
    // DAY
    let g = ctx.createLinearGradient(0,0,0,canvas.height);
    g.addColorStop(0,"#89f7fe");
    g.addColorStop(1,"#66a6ff");
    ctx.fillStyle = g;
  } else {
    // NIGHT
    let g = ctx.createLinearGradient(0,0,0,canvas.height);
    g.addColorStop(0,"#0f2027");
    g.addColorStop(1,"#203a43");
    ctx.fillStyle = g;
  }

  ctx.fillRect(0,0,canvas.width,canvas.height);
}

/* ---------------- BIRD ---------------- */
function drawBird(){

  let s = skins[currentSkin];

  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(bird.vel * 0.03);

  ctx.fillStyle = s.body;
  ctx.beginPath();
  ctx.arc(0,0,bird.r,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle = s.wing;
  ctx.beginPath();
  ctx.arc(-6,5,10,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle = "#000";
  ctx.beginPath();
  ctx.arc(8,-5,3,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle = s.blush;
  ctx.beginPath();
  ctx.arc(-8,5,4,0,Math.PI*2);
  ctx.fill();

  ctx.restore();
}

/* ---------------- COINS ---------------- */
function spawnCoin(){
  if(Math.random() < 0.6){
    coinsArr.push({
      x: canvas.width,
      y: Math.random() * (canvas.height - 200) + 100,
      r: 10
    });
  }
}

function updateCoins(){
  coinsArr.forEach(c=>{
    c.x -= speed;

    let dx = bird.x - c.x;
    let dy = bird.y - c.y;
    let dist = Math.sqrt(dx*dx + dy*dy);

    if(dist < bird.r + c.r){
      coins++;
      localStorage.setItem("sky_coins", coins);
      c.collected = true;
    }
  });

  coinsArr = coinsArr.filter(c=>!c.collected && c.x > -50);
}

function drawCoins(){
  ctx.fillStyle="#FFD700";
  coinsArr.forEach(c=>{
    ctx.beginPath();
    ctx.arc(c.x,c.y,c.r,0,Math.PI*2);
    ctx.fill();
  });
}

/* ---------------- PHYSICS (FIXED FEEL) ---------------- */
function updateBird(){

  bird.vel += bird.gravity;
  bird.vel *= 0.98; // smooth control (removes "magnet feel")
  bird.y += bird.vel;

  if(bird.y + bird.r > canvas.height){
    state = STATE.OVER;
  }

  if(bird.y - bird.r < 0){
    bird.y = bird.r;
    bird.vel = 0;
  }
}

/* ---------------- PIPES ---------------- */
function createPipe(){
  pipes.push({
    x:canvas.width,
    top:Math.random()*(canvas.height-300)+50,
    passed:false
  });
}

function drawPipes(){
  ctx.fillStyle="#7ED957";

  pipes.forEach(p=>{
    ctx.fillRect(p.x,0,80,p.top);
    ctx.fillRect(p.x,p.top+gap,80,canvas.height);
  });
}

function updatePipes(){

  pipes.forEach(p=>{

    p.x -= speed;

    if(!p.passed && p.x + 80 < bird.x){
      p.passed = true;
      score++;
    }

    // clean hitbox (NO magnet death feeling)
    if(
      bird.x + bird.r > p.x &&
      bird.x - bird.r < p.x + 80 &&
      (bird.y - bird.r < p.top || bird.y + bird.r > p.top + gap)
    ){
      state = STATE.OVER;
    }

  });

  pipes = pipes.filter(p=>p.x > -100);
}

/* ---------------- UI ---------------- */
function drawUI(){

  ctx.fillStyle="#fff";
  ctx.font="30px Arial";
  ctx.fillText("Score: "+score,20,40);

  ctx.fillText("Coins: "+coins,20,80);

  ctx.fillText("High: "+highScore,20,120);
}

/* ---------------- SHOP ---------------- */
function shop(){

  ctx.fillStyle="rgba(255,255,255,0.95)";
  ctx.fillRect(40,100,canvas.width-80,400);

  ctx.fillStyle="#000";
  ctx.font="40px Arial";
  ctx.textAlign="center";
  ctx.fillText("DINOSAUR SKINS",canvas.width/2,170);

  skins.forEach((s,i)=>{

    ctx.fillStyle=s.body;
    ctx.beginPath();
    ctx.arc(120 + i*120, 300, 25, 0, Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#333";
    ctx.font="16px Arial";

    if(ownedSkins.includes(i)){
      ctx.fillText("OWNED",100+i*120,340);
    } else {
      ctx.fillText("20 COINS",95+i*120,340);
    }

  });

  ctx.textAlign="left";
}

/* ---------------- RESET ---------------- */
function reset(){
  pipes=[];
  coinsArr=[];
  score=0;
  frame=0;

  speed = 3;
  spawnRate = 90;
  gap = 180;

  bird.y=250;
  bird.vel=0;

  state=STATE.PLAY;
}

/* ---------------- LOOP ---------------- */
function loop(){

  drawBackground();

  if(state === STATE.PLAY){

    updateBird();
    updatePipes();
    updateCoins();

    if(frame % spawnRate === 0){
      createPipe();
      spawnCoin();
    }

    // difficulty ONLY after 50 score
    if(score > 50){
      speed = 5;
      spawnRate = 65;
      gap = 150;
    }

    drawPipes();
    drawCoins();
    drawBird();
    drawUI();

    frame++;
  }

  if(state === STATE.OVER){

    if(score > highScore){
      highScore = score;
      localStorage.setItem("sky_high", highScore);
    }

    drawPipes();
    drawCoins();
    drawBird();

    ctx.fillStyle="rgba(0,0,0,0.5)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle="#fff";
    ctx.font="50px Arial";
    ctx.textAlign="center";

    ctx.fillText("Game Over",canvas.width/2,canvas.height/2-40);
    ctx.fillText("Score: "+score,canvas.width/2,canvas.height/2+20);
    ctx.fillText("Tap to Restart",canvas.width/2,canvas.height/2+80);

    ctx.textAlign="left";
  }

  requestAnimationFrame(loop);
}

/* ---------------- INPUT ---------------- */
function tap(){

  if(state === STATE.OVER){
    reset();
    return;
  }

  bird.vel = bird.lift;
}

document.addEventListener("touchstart",tap);
document.addEventListener("mousedown",tap);

loop();

</script>

</body>
</html>
