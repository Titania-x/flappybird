<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sky Mochi</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  overflow:hidden;
  background:#AEE2FF;
  font-family:Arial, sans-serif;
}

canvas{
  display:block;
}

</style>
</head>

<body>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

window.addEventListener("resize", () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});

let gameStarted = false;
let gameOver = false;
let score = 0;
let frame = 0;

const bird = {
  x:120,
  y:250,
  radius:22,
  gravity:0.6,
  lift:-10,
  velocity:0
};

let pipes = [];
let clouds = [];

for(let i = 0; i < 5; i++){
  clouds.push({
    x:Math.random() * canvas.width,
    y:Math.random() * 250,
    size:50 + Math.random() * 40
  });
}

function drawBackground(){

  let gradient = ctx.createLinearGradient(0,0,0,canvas.height);

  gradient.addColorStop(0,"#89f7fe");
  gradient.addColorStop(1,"#66a6ff");

  ctx.fillStyle = gradient;
  ctx.fillRect(0,0,canvas.width,canvas.height);

  clouds.forEach(cloud => {

    ctx.fillStyle = "rgba(255,255,255,0.8)";

    ctx.beginPath();
    ctx.arc(cloud.x, cloud.y, cloud.size, 0, Math.PI * 2);
    ctx.arc(cloud.x + 40, cloud.y + 10, cloud.size * 0.8, 0, Math.PI * 2);
    ctx.arc(cloud.x - 40, cloud.y + 10, cloud.size * 0.8, 0, Math.PI * 2);
    ctx.fill();

    cloud.x -= 0.3;

    if(cloud.x < -100){
      cloud.x = canvas.width + 100;
    }

  });

}

function drawBird(){

  ctx.save();

  ctx.translate(bird.x, bird.y);
  ctx.rotate(bird.velocity * 0.05);

  // body
  ctx.fillStyle = "#FFD166";
  ctx.beginPath();
  ctx.arc(0,0,bird.radius,0,Math.PI * 2);
  ctx.fill();

  // wing
  ctx.fillStyle = "#FFC300";
  ctx.beginPath();
  ctx.arc(-5,5,10,0,Math.PI * 2);
  ctx.fill();

  // eye
  ctx.fillStyle = "black";
  ctx.beginPath();
  ctx.arc(8,-5,3,0,Math.PI * 2);
  ctx.fill();

  // blush
  ctx.fillStyle = "#FF8FAB";
  ctx.beginPath();
  ctx.arc(-8,5,4,0,Math.PI * 2);
  ctx.fill();

  // beak
  ctx.fillStyle = "orange";
  ctx.beginPath();
  ctx.moveTo(18,0);
  ctx.lineTo(28,4);
  ctx.lineTo(18,8);
  ctx.fill();

  ctx.restore();

}

function updateBird(){

  bird.velocity += bird.gravity;
  bird.y += bird.velocity;

  if(bird.y + bird.radius > canvas.height){
    gameOver = true;
  }

  if(bird.y - bird.radius < 0){
    bird.y = bird.radius;
    bird.velocity = 0;
  }

}

function createPipe(){

  let top = Math.random() * (canvas.height - 400) + 50;

  pipes.push({
    x:canvas.width,
    top:top,
    bottom:top + 180,
    width:80,
    passed:false
  });

}

function drawPipes(){

  pipes.forEach(pipe => {

    ctx.fillStyle = "#7ED957";

    // top pipe
    ctx.beginPath();
    ctx.roundRect(
      pipe.x,
      0,
      pipe.width,
      pipe.top,
      20
    );
    ctx.fill();

    // bottom pipe
    ctx.beginPath();
    ctx.roundRect(
      pipe.x,
      pipe.bottom,
      pipe.width,
      canvas.height,
      20
    );
    ctx.fill();

  });

}

function updatePipes(){

  pipes.forEach(pipe => {

    pipe.x -= 4;

    // score
    if(!pipe.passed && pipe.x + pipe.width < bird.x){
      pipe.passed = true;
      score++;
    }

    // collision
    if(
      bird.x + bird.radius > pipe.x &&
      bird.x - bird.radius < pipe.x + pipe.width &&
      (
        bird.y - bird.radius < pipe.top ||
        bird.y + bird.radius > pipe.bottom
      )
    ){
      gameOver = true;
    }

  });

  pipes = pipes.filter(pipe => pipe.x + pipe.width > 0);

}

function drawScore(){

  ctx.fillStyle = "white";
  ctx.font = "bold 50px Arial";
  ctx.fillText(score, 30, 70);

}

function drawStartScreen(){

  ctx.fillStyle = "rgba(255,255,255,0.9)";
  ctx.fillRect(40,120,canvas.width - 80,300);

  ctx.fillStyle = "#ff69b4";
  ctx.font = "bold 60px Arial";
  ctx.textAlign = "center";

  ctx.fillText(
    "Sky Mochi",
    canvas.width / 2,
    220
  );

  ctx.fillStyle = "#555";
  ctx.font = "30px Arial";

  ctx.fillText(
    "Tap to Flap",
    canvas.width / 2,
    300
  );

  ctx.fillText(
    "Avoid the pipes!",
    canvas.width / 2,
    350
  );

}

function drawGameOver(){

  ctx.fillStyle = "rgba(0,0,0,0.5)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle = "white";
  ctx.textAlign = "center";

  ctx.font = "bold 60px Arial";
  ctx.fillText(
    "Game Over",
    canvas.width / 2,
    canvas.height / 2 - 50
  );

  ctx.font = "40px Arial";
  ctx.fillText(
    "Score: " + score,
    canvas.width / 2,
    canvas.height / 2 + 20
  );

  ctx.font = "28px Arial";
  ctx.fillText(
    "Tap to Restart",
    canvas.width / 2,
    canvas.height / 2 + 90
  );

}

function resetGame(){

  bird.y = 250;
  bird.velocity = 0;

  pipes = [];

  score = 0;
  frame = 0;

  gameOver = false;

}

function gameLoop(){

  drawBackground();

  drawBird();

  if(gameStarted && !gameOver){

    updateBird();

    if(frame % 90 === 0){
      createPipe();
    }

    drawPipes();
    updatePipes();

    drawScore();

    frame++;

  }

  else if(!gameStarted){

    drawStartScreen();

  }

  else if(gameOver){

    drawPipes();
    drawGameOver();

  }

  requestAnimationFrame(gameLoop);

}

function flap(){

  if(!gameStarted){
    gameStarted = true;
  }

  if(gameOver){
    resetGame();
    return;
  }

  bird.velocity = bird.lift;

}

document.addEventListener("touchstart", flap);
document.addEventListener("mousedown", flap);

gameLoop();

</script>

</body>
</html>
